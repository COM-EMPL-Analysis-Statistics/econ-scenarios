# rho: the EU baseline uses 0.75 / 0.5 / 0.25 (between the historical and recent US ratio, recent
# US ratio, Antropic's substantial). This variant runs Antropic's own 0.5 / 0.25 / 0 on the EU baseline.
name: rho Antropic
description: reinstatement share at Antropic's 0.5 / 0.25 / 0 instead of 0.75 / 0.5 / 0.25
base: eu
overrides:
  rho: {modest: 0.5, substantial: 0.25, extreme: 0.0}
