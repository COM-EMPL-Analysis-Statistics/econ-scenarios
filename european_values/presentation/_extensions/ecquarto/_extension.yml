title: EC corporate presentation
author: COM-EMPL Analysis & Statistics
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    common:
      filters:
        - ec-backgrounds.lua
    revealjs:
      theme: ec-corporate-quarto.scss
      slide-number: c/t
      logo: ""
      footer: ""
      center: false
      margin: 0
      progress: false
      menu: false
      embed-resources: true
      include-in-header:
        text: |
          <script>
          document.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
              window.location.search = '?print-pdf';
            }
          });
          </script>
    pptx:
      reference-doc: ec-corporate.pptx
